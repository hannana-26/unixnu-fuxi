name: build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "kernel 或 firmware"
        required: false
        default: kernel

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 300
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 取设备仓库
        uses: actions/checkout@v4
        with:
          path: work/unixnu-fuxi
          submodules: recursive

      - name: 取 UniXNU 主仓库
        uses: actions/checkout@v4
        with:
          repository: OddlyLabs/UniXNU
          ref: fuxi
          path: work/UniXNU
          submodules: recursive

      - name: 取 UEFI 固件仓库
        uses: actions/checkout@v4
        with:
          repository: OddlyLabs/uefi-fuxi
          ref: fuxi
          path: work/uefi-fuxi
          submodules: recursive

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version

      - name: 取小米13设备树
        run: |
          set -e
          DST=work/uefi-fuxi/Resources/DTBs/fuxi.dtb
          mkdir -p "$(dirname "$DST")"
          curl -fsSL --retry 3 -o "$DST" \
            https://raw.githubusercontent.com/ljhhkx529/uefi-fuxi/fuxi/Resources/DTBs/fuxi.dtb
          ACTUAL=$(shasum -a 256 "$DST" | cut -d' ' -f1)
          WANT=0590a46ca03be8de4cdf273f4ba4bc884e41555e771f55d2601ba9df121b5d5c
          echo "dtb sha256=$ACTUAL size=$(wc -c < "$DST")"
          [ "$ACTUAL" = "$WANT" ] || { echo "设备树哈希与固定值不符"; exit 1; }

      - name: 选择设备配置
        working-directory: work/UniXNU
        run: ./unixnu defconfig fuxi_defconfig -D ../unixnu-fuxi

      - name: 拉取源码与子模块
        working-directory: work/UniXNU
        run: ./unixnu fetch
        timeout-minutes: 90

      - name: 第一遍（跳过依赖候选内核的归档）
        working-directory: work/UniXNU
        run: |
          set -o pipefail
          python3 - "$GITHUB_WORKSPACE/work/unixnu-fuxi" <<'PY'
          import sys
          from pathlib import Path

          repo = Path(sys.argv[1])
          board = repo / 'board.toml'
          scripts = repo / 'scripts'
          text = board.read_text()
          if not (repo / 'board.toml.orig').exists():
              (repo / 'board.toml.orig').write_text(text)

          markers = ('native-prelink', 'display-analysis', 'audit-amfi-pmgr-contract')
          kept, dropped = [], []
          for line in text.splitlines():
              stripped = line.strip().strip('",')
              token = stripped.split(' ')[0] if stripped else ''
              if token.endswith('.py') and (scripts / token).is_file():
                  body = (scripts / token).read_text(errors='replace')
                  if any(m in body for m in markers):
                      dropped.append(token)
                      continue
              kept.append(line)
          board.write_text('\n'.join(kept) + '\n')
          print('跳过:', dropped or '无')
          PY
          ./unixnu build kernel

      - name: 恢复完整归档并重编
        working-directory: work/UniXNU
        run: |
          set -o pipefail
          REPO="$GITHUB_WORKSPACE/work/unixnu-fuxi"
          cp "$REPO/board.toml.orig" "$REPO/board.toml"
          rm -f "$REPO/board.toml.orig"
          echo "归档行数: $(grep -c '^  "' "$REPO/board.toml" || true)"
          ls out/fuxi/tree/build/native-prelink 2>/dev/null | head || echo "无候选目录"
          ./unixnu build kernel

      - name: 产物清单
        if: always()
        run: |
          find work/UniXNU/out -type f \( -name '*.macho' -o -name '*.json' -o -name '*.log' \) -exec ls -l {} \; 2>/dev/null | awk '{print $5"  "$9}' | sort -k2 | tail -100 || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          retention-days: 7
          path: |
            work/UniXNU/out/**/kernel/**
            work/UniXNU/out/**/logs/**
            work/UniXNU/out/**/build/native-prelink/**
            work/UniXNU/out/state.json
          if-no-files-found: warn
