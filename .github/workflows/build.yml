name: build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "kernel 或 firmware"
        required: false
        default: kernel
      firstpass:
        description: "第一遍：跳过需要候选内核的归档"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: 取设备仓库
        uses: actions/checkout@v4
        with:
          path: work/unixnu-fuxi
          submodules: recursive

      - name: 取 UniXNU 主仓库
        uses: actions/checkout@v4
        with:
          repository: OddlyLabs/UniXNU
          ref: fuxi
          path: work/UniXNU
          submodules: recursive

      - name: 取 UEFI 固件仓库
        uses: actions/checkout@v4
        with:
          repository: OddlyLabs/uefi-fuxi
          ref: fuxi
          path: work/uefi-fuxi
          submodules: recursive

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version

      - name: 第一遍跳过依赖候选的归档
        if: inputs.firstpass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('work/unixnu-fuxi/board.toml')
          lines = p.read_text().splitlines()
          keep = [l for l in lines if 'build-sheng-platform-power.py' not in l]
          p.write_text("\n".join(keep) + "\n")
          print(f'移除 {len(lines) - len(keep)} 行')
          PY
          grep -n "build-sheng-platform-power" work/unixnu-fuxi/board.toml || echo "已无该归档"

      - name: 选择设备配置
        working-directory: work/UniXNU
        run: ./unixnu defconfig fuxi_defconfig -D ../unixnu-fuxi

      - name: 解析状态
        working-directory: work/UniXNU
        run: ./unixnu status --json || true

      - name: 拉取源码与子模块
        working-directory: work/UniXNU
        run: ./unixnu fetch
        timeout-minutes: 90

      - name: 构建
        working-directory: work/UniXNU
        run: ./unixnu build ${{ inputs.target || 'kernel' }}

      - name: 产物清单
        if: always()
        run: |
          find work/UniXNU/out -type f \( -name '*.macho' -o -name '*.json' -o -name '*.log' \) -exec ls -l {} \; 2>/dev/null | awk '{print $5"  "$9}' | sort -k2 | tail -80 || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          retention-days: 7
          path: |
            work/UniXNU/out/**/kernel/**
            work/UniXNU/out/**/logs/**
            work/UniXNU/out/**/build/native-prelink/**
            work/UniXNU/out/state.json
          if-no-files-found: warn
